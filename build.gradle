
plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.13.3'
}

version = '1.0.0'
group = 'com.voxyandroid'
base {
    archivesName = 'voxy-android-fix'
}

    repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    }
maven {
    name = 'Modrinth'
    url = 'https://api.modrinth.com/maven'
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()

    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'
}
modImplementation 'maven.modrinth:fxxUqruK:H3w2nVdU'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
